# Qanawat Concierge — playground stack (web UI + agent worker).
# Values are read from deploy/.env (see .env.example). Run from this directory:
#   docker compose up -d --build

name: qanawat-playground

services:
  web:
    build:
      context: ../web
      args:
        # Inlined into the client bundle at build time.
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}
        # Optional single-line YAML override; branding defaults live in the code.
        NEXT_PUBLIC_APP_CONFIG: ${NEXT_PUBLIC_APP_CONFIG:-}
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}
    ports:
      # Bind to loopback only; the host nginx vhost terminates TLS and proxies in.
      - "127.0.0.1:3002:3000"
    restart: unless-stopped

  agent:
    build:
      context: ../agent
    environment:
      LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    # Outbound only — the worker dials LiveKit Cloud. No published ports.
    restart: unless-stopped
