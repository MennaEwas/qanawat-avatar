# Qanawat Concierge — self-hosted stack (web UI + admin panel + agent worker).
# Values are read from deploy/.env (web) and deploy/agent.env (agent); see the
# matching *.example files. Run from this directory:
#   docker compose up -d --build

name: qanawat-playground

services:
  web:
    build:
      context: ../web
      args:
        # Inlined into the client bundle at build time.
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}
        # Optional single-line YAML override; branding defaults live in the code.
        NEXT_PUBLIC_APP_CONFIG: ${NEXT_PUBLIC_APP_CONFIG:-}
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}
      # Must match AGENT_NAME in agent.env -- calls are dispatched by name.
      AGENT_NAME: ${AGENT_NAME:-alsalam-concierge}
      # /admin login.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      # Screen configs + uploaded backgrounds live on the volume below.
      SCREEN_STORAGE: filesystem
      SCREEN_DATA_DIR: /app/data
    volumes:
      - screen-data:/app/data
    ports:
      # Bind to loopback only; the host nginx vhost terminates TLS and proxies in.
      - "127.0.0.1:3002:3000"
    restart: unless-stopped

  agent:
    build:
      context: ../agent
    # Everything in agent/.env.example (LiveKit, alexa360, HeyGen LiveAvatar,
    # WhatsApp, hospital MCP, voice/model defaults, AGENT_NAME).
    env_file: ./agent.env
    # Outbound only — the worker dials LiveKit. No published ports.
    restart: unless-stopped

volumes:
  # Back this up: it holds every screen's admin settings and uploaded images.
  screen-data:
